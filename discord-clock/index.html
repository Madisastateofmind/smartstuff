<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Clock Together</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #1a202c;
    color: #edf2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    box-sizing: border-box;
    margin: 0;
  }
  .container {
    background-color: #2d3748;
    border-radius: 12px;
    padding: 30px 40px;
    box-shadow: 0 0 15px rgba(0,0,0,0.7);
    width: 430px;
    max-width: 100%;
    box-sizing: border-box;
    margin: auto;
    text-align: center;
  }
  h1 {
    margin-bottom: 25px;
    font-size: 24px;
  }
  .clock {
    margin-bottom: 20px;
  }
  .label {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
    color: #A1DAFF;
  }
  .time {
    font-size: 18px;
    line-height: 1.4;
  }
  .time .date {
    display: block;
    font-size: 12px;
    color: #9BB2C4;
  }
  .timezone-note {
    font-size: 11px;
    line-height: 1.35;
    margin-top: 8px;
  }
  select {
    width: auto;
    max-width: 100%;
    display: block;
    padding: 6px;
    border-radius: 6px;
    font-size: 12px;
    margin: 5px auto 10px;
    background-color: #1a202c;
    color: #d9edff;
    border: 1px solid rgba(0, 0, 0, 0.7);
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
    text-shadow: -1px 0 #1a202c, 1px 0 #1a202c, 0 -1px #1a202c, 0 1px #1a202c;
  }
  select option {
    background-color: #1a202c;
    color: #d9edff;
    text-shadow: -1px 0 #1a202c, 1px 0 #1a202c, 0 -1px #1a202c, 0 1px #1a202c;
  }
  @media (max-width: 480px) {
    .container { padding: 24px 16px; }
  }

  :root { --view-scale: 1; }
  .container {
    width: calc(430px * var(--view-scale));
    padding: calc(30px * var(--view-scale)) calc(40px * var(--view-scale));
    overflow-wrap: anywhere;
  }
  h1 { font-size: calc(24px * var(--view-scale)); margin-bottom: calc(25px * var(--view-scale)); }
  .clock { margin-bottom: calc(20px * var(--view-scale)); }
  .label { font-size: calc(18px * var(--view-scale)); margin-bottom: calc(8px * var(--view-scale)); }
  .time { font-size: calc(18px * var(--view-scale)); }
  .time .date { font-size: calc(12px * var(--view-scale)); }
  .timezone-note { font-size: calc(11px * var(--view-scale)); }
  select { font-size: calc(12px * var(--view-scale)); padding: calc(6px * var(--view-scale)); }
  .view-controls { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px; }
  .view-size-row { display:flex; justify-content:center; align-items:center; gap:10px; }
  .view-controls #viewReset { min-width:31px; min-height:31px; padding:4.2px 8.4px; border-radius:5.6px; font-size:12.6px; }
  .view-controls button { min-width:44px; min-height:44px; padding:6px 12px; border:1px solid #a1daff66; border-radius:8px; background:linear-gradient(100deg,#124493,#08736b,#068a32); color:#fff; font: bold 18px Arial,sans-serif; cursor:pointer; touch-action:manipulation; box-shadow:inset 0 1px 0 #ffffff55, inset 0 -2px 0 #0005, 0 3px 5px #0004; transition:box-shadow .1s ease, transform .1s ease, filter .1s ease; }
  .view-controls button:not(:disabled):active { transform:translateY(2px); filter:brightness(.88); box-shadow:inset 0 3px 6px #0008, inset 0 -1px 0 #ffffff33, 0 1px 2px #0003; }
  @media (prefers-reduced-motion:reduce) { .view-controls button { transition:none; } }
  .view-controls button:disabled { opacity:.45; cursor:default; }
  .view-controls button:focus-visible { outline:3px solid #a1daff; outline-offset:3px; }
  #viewPercent { min-width:62px; font-size:16px; }
  @media (max-width:480px) {
    .container { padding:calc(24px * var(--view-scale)) calc(16px * var(--view-scale)); }
  }


  .timezone-picker { display:block; width:100%; max-width:100%; margin:5px auto 10px; padding:8px 10px; border:1px solid #a1daff66; border-radius:6px; background:#1a202c; color:#d9edff; font:inherit; font-size:clamp(12px,calc(12px * var(--view-scale)),24px); text-align:left; cursor:pointer; }
  .timezone-picker::after { content:" ▾"; float:right; }
  .timezone-picker:focus-visible,.timezone-menu:focus-visible { outline:2px solid #a1daff; outline-offset:2px; }
  .timezone-menu { position:fixed; z-index:100; box-sizing:border-box; margin:0; padding:6px; overflow-y:auto; overscroll-behavior:contain; border:1px solid #a1daff66; border-radius:8px; background:#1a202c; color:#d9edff; box-shadow:0 8px 24px #0008; color-scheme:dark; scrollbar-color:#52647c #1a202c; }
  .timezone-menu[hidden],select[hidden] { display:none; }
  .timezone-menu [role="option"] { box-sizing:border-box; padding:10px; min-height:44px; border-radius:4px; font-size:clamp(14px,calc(12px * var(--view-scale)),24px); line-height:1.4; cursor:pointer; overflow-wrap:anywhere; }
  .timezone-menu [aria-selected="true"] { font-weight:bold; }
  .timezone-menu [aria-selected="true"]::before { content:"✓ "; }
  .timezone-menu .active,.timezone-menu [role="option"]:hover { background:#2d3748; color:#d9edff; }

  .timezone-menu { display:flex; flex-direction:column; overflow:hidden; }
  .timezone-options { overflow-y:auto; overscroll-behavior:contain; min-height:0; scrollbar-color:#52647c #1a202c; }
  .timezone-options:focus-visible { outline:2px solid #a1daff; outline-offset:-2px; }
  .timezone-menu-close { flex:none; align-self:flex-start; display:flex; align-items:center; justify-content:center; width:44px; height:44px; margin:0 0 4px; padding:0; border:0; border-radius:8px; background:#d9edff12; color:rgba(217,237,255,0.8); font:24px/1 Arial,sans-serif; cursor:pointer; touch-action:manipulation; }
  .timezone-menu-close:hover,.timezone-menu-close:active { background:#d9edff26; color:#d9edff; }
  .timezone-menu-close:focus-visible { outline:2px solid #a1daff; outline-offset:-2px; }

  /* The offset picker fills the Activity viewport, including on phones. */
  .timezone-menu {
    inset:0;
    width:100%;
    height:100%;
    max-height:none;
    border:0;
    border-radius:0;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .timezone-options { flex:1; }
</style>
</head>
<body>

<div class="container">
  <div class="view-controls" role="group" aria-label="Clock view size relative to automatic fit">
    <div class="view-size-row">
    <button type="button" id="viewSmaller" aria-label="Make clock view smaller">−</button>
    <output id="viewPercent" aria-live="polite" aria-label="Clock view size relative to automatic fit" title="100% automatically fits the window; − and + adjust that size">100%</output>
    <button type="button" id="viewLarger" aria-label="Make clock view larger">+</button>
    </div>
    <button type="button" id="viewReset" aria-label="Reset clock view to automatic fit at 100 percent">Reset</button>
  </div>
  <h1>⏰ Live Time Comparison</h1>

  <div class="clock">
    <div class="label">🇬🇧 England (GMT/BST)</div>
    <div class="time" id="englandTime"><span class="clock-time">Loading...</span><span class="date"></span></div>
  </div>

  <div class="clock">
    <div class="label">🇺🇸 Eastern (EST/EDT)</div>
    <div class="time" id="easternTime"><span class="clock-time">Loading...</span><span class="date"></span></div>
  </div>

  <div class="clock">
    <div class="label">🇺🇸 Pacific (PST/PDT)</div>
    <div class="time" id="pacificTime"><span class="clock-time">Loading...</span><span class="date"></span></div>
  </div>

  <div class="clock">
    <label class="label" for="timeZoneSelect">🌐 Choose a UTC offset</label>
    <select id="timeZoneSelect">
      <option value="-12">-12 UTC - USA/Baker Island</option>
      <option value="-11">-11 SST - American Samoa/Pago Pago</option>
      <option value="-10">-10 HST - USA/Honolulu</option>
      <option value="-9">-9 AKST - USA/Anchorage</option>
      <option value="-8">-8 PST - USA/Los Angeles</option>
      <option value="-7">-7 MST - USA/Denver</option>
      <option value="-6">-6 CST - USA/Chicago</option>
      <option value="-5">-5 EST - USA/New York, Canada/Toronto</option>
      <option value="-4">-4 AST - Canada/Halifax</option>
      <option value="-3">-3 BRT - Brazil/São Paulo</option>
      <option value="-2">-2 FNT - Brazil/Fernando de Noronha</option>
      <option value="-1">-1 AZOT - Portugal/Azores</option>
      <option value="0" selected>+0 GMT - Europe/England</option>
      <option value="1">+1 CET - France/Paris</option>
      <option value="2">+2 SAST - South Africa/Johannesburg</option>
      <option value="3">+3 TRT - Türkiye/Istanbul</option>
      <option value="4">+4 GST - UAE/Dubai</option>
      <option value="5">+5 PKT - Pakistan/Karachi</option>
      <option value="6">+6 BST - Bangladesh/Dhaka</option>
      <option value="7">+7 ICT - Thailand/Bangkok</option>
      <option value="8">+8 SGT - Singapore</option>
      <option value="9">+9 JST - Japan/Tokyo</option>
      <option value="10">+10 AEST - Australia/Brisbane</option>
      <option value="11">+11 SBT - Solomon Islands/Honiara</option>
      <option value="12">+12 FJT - Fiji/Suva</option>
      <option value="13">+13 TOT - Tonga/Nukuʻalofa</option>
      <option value="14">+14 LINT - Kiribati/Kiritimati</option>
    </select>
    <div class="time" id="selectedTime"><span class="clock-time">Loading...</span><span class="date"></span></div>
    <div class="timezone-note">Fixed standard-time offsets. <br>Some places shift one hour for daylight saving time.</div>
  </div>

  <div class="clock">
    <div class="label">🌍 Your Local Time</div>
    <div class="time" id="localTime"><span class="clock-time">Loading...</span><span class="date"></span></div>
  </div>
</div>

<script>

let viewPercent = 100;
function fitClockView() {
  const container = document.querySelector(".container");
  const controls = document.querySelector(".view-controls");
  // Measure the natural clock size, then fit it to this Activity's viewport.
  // These temporary styles are restored before the browser paints.
  document.documentElement.style.setProperty("--view-scale", 1);
  container.style.maxWidth = "none";
  container.style.width = "430px";
  const naturalHeight = container.offsetHeight;
  const fixedHeight = controls.offsetHeight + 20;
  container.style.removeProperty("max-width");
  container.style.removeProperty("width");
  const availableWidth = Math.max(1, window.innerWidth - 32);
  const availableHeight = Math.max(1, window.innerHeight - 32);
  const autoScale = Math.max(0.5, Math.min(
    1,
    availableWidth / 430,
    (availableHeight - fixedHeight) / Math.max(1, naturalHeight - fixedHeight)
  ));
  document.documentElement.style.setProperty("--view-scale", autoScale * viewPercent / 100);
}
function setViewSize(percent) {
  viewPercent = Math.max(10, Math.min(500, percent));
  document.getElementById("viewPercent").textContent = viewPercent + "%";
  document.getElementById("viewSmaller").disabled = viewPercent === 10;
  document.getElementById("viewLarger").disabled = viewPercent === 500;
  fitClockView();
}
document.getElementById("viewSmaller").addEventListener("click", () => setViewSize(viewPercent - (viewPercent <= 50 ? 10 : 25)));
document.getElementById("viewLarger").addEventListener("click", () => setViewSize(viewPercent + (viewPercent < 50 ? 10 : 25)));
document.getElementById("viewReset").addEventListener("click", () => setViewSize(100));
let resizeFrame;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(fitClockView);
});
setViewSize(100);

function formatClock(date, timeZone, fixedOffset) {
  const zone = timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const time = date.toLocaleTimeString("en-US", {
    timeZone: zone,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
  const day = date.toLocaleDateString("en-US", {
    timeZone: zone,
    year: "numeric",
    month: "long",
    day: "numeric"
  });
  const offsetName = fixedOffset === undefined
    ? new Intl.DateTimeFormat("en-US", { timeZone: zone, timeZoneName: "shortOffset" })
        .formatToParts(date).find(part => part.type === "timeZoneName").value
    : `GMT${fixedOffset >= 0 ? "+" : ""}${fixedOffset}`;
  const offset = offsetName === "GMT" ? "GMT+0" : offsetName;
  return { time: `${offset} ${time}`, date: day };
}

function showClock(id, clock) {
  const element = document.getElementById(id);
  element.querySelector(".clock-time").textContent = clock.time;
  element.querySelector(".date").textContent = clock.date;
}

function updateClocks() {
  const now = new Date();

  showClock("englandTime", formatClock(now, "Europe/London"));
  showClock("easternTime", formatClock(now, "America/New_York"));
  showClock("pacificTime", formatClock(now, "America/Los_Angeles"));
  const selectedOffset = Number(document.getElementById("timeZoneSelect").value);
  showClock("selectedTime", formatClock(
    new Date(now.getTime() + selectedOffset * 3600000), "Etc/UTC", selectedOffset
  ));
  showClock("localTime", formatClock(now));
}

document.getElementById("timeZoneSelect").value = "0";

function createTimezonePicker() {
  const select = document.getElementById("timeZoneSelect");
  const label = document.querySelector('label[for="timeZoneSelect"]');
  label.id = "timezoneLabel";
  const trigger = document.createElement("button");
  trigger.type = "button";
  trigger.id = "timezonePicker";
  trigger.className = "timezone-picker";
  trigger.setAttribute("aria-haspopup", "listbox");
  trigger.setAttribute("aria-expanded", "false");
  trigger.setAttribute("aria-controls", "timezoneOptions");
  trigger.setAttribute("aria-labelledby", "timezoneLabel timezonePicker");
  const menu = document.createElement("div");
  menu.id = "timezoneMenu";
  menu.className = "timezone-menu";
  menu.hidden = true;
  const closeButton = document.createElement("button");
  closeButton.type = "button";
  closeButton.className = "timezone-menu-close";
  closeButton.textContent = "×";
  closeButton.setAttribute("aria-label", "Close timezone dropdown");
  closeButton.addEventListener("click", () => close(true));
  menu.appendChild(closeButton);
  const list = document.createElement("div");
  list.className = "timezone-options";
  list.id = "timezoneOptions";
  list.setAttribute("role", "listbox");
  list.setAttribute("aria-labelledby", "timezoneLabel");
  list.tabIndex = -1;
  menu.appendChild(list);
  const options = Array.from(select.options);
  const entries = options.map((option, index) => {
    const entry = document.createElement("div");
    entry.id = "timezoneOption" + index;
    entry.setAttribute("role", "option");
    entry.textContent = option.textContent;
    entry.addEventListener("click", () => choose(index));
    list.appendChild(entry);
    return entry;
  });
  let activeIndex = select.selectedIndex;
  let search = "";
  let lastKey = 0;
  function highlight(index) {
    activeIndex = Math.max(0, Math.min(entries.length - 1, index));
    entries.forEach((entry, i) => entry.classList.toggle("active", i === activeIndex));
    list.setAttribute("aria-activedescendant", entries[activeIndex].id);
    entries[activeIndex].scrollIntoView({ block:"nearest" });
  }
  function sync() {
    trigger.textContent = options[select.selectedIndex].textContent;
    entries.forEach((entry, i) => entry.setAttribute("aria-selected", String(i === select.selectedIndex)));
  }
  function close(returnFocus = false) {
    menu.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
    if (returnFocus) trigger.focus();
  }
  function open() {
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    list.focus();
    highlight(select.selectedIndex);
  }
  function choose(index) {
    select.selectedIndex = index;
    sync();
    updateClocks();
    close(true);
  }
  trigger.addEventListener("click", () => menu.hidden ? open() : close(true));
  trigger.addEventListener("keydown", event => {
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      open();
    }
  });
  menu.addEventListener("keydown", event => {
    if (event.target === closeButton && event.key !== "Escape") return;
    if (event.key === "Tab") { close(true); return; }
    if (event.key === "Escape") { event.preventDefault(); close(true); return; }
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choose(activeIndex); return; }
    const movements = { ArrowDown:activeIndex + 1, ArrowUp:activeIndex - 1, Home:0, End:entries.length - 1 };
    if (event.key in movements) { event.preventDefault(); highlight(movements[event.key]); return; }
    if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      const now = Date.now();
      search = (now - lastKey > 700 ? "" : search) + event.key.toLowerCase();
      lastKey = now;
      const match = options.findIndex(option => option.textContent.toLowerCase().includes(search));
      if (match >= 0) highlight(match);
    }
  });
  document.addEventListener("pointerdown", event => {
    if (!menu.contains(event.target) && !trigger.contains(event.target)) close();
  });
  document.addEventListener("focusin", event => {
    if (!menu.contains(event.target) && !trigger.contains(event.target)) close();
  });
  window.addEventListener("resize", () => close());
  window.addEventListener("scroll", event => {
    if (!menu.contains(event.target)) close();
  }, true);
  select.addEventListener("change", sync);
  select.insertAdjacentElement("afterend", trigger);
  document.body.appendChild(menu);
  label.htmlFor = trigger.id;
  select.hidden = true;
  sync();
}

createTimezonePicker();
fitClockView();
updateClocks();
setInterval(updateClocks, 1000);
</script>

<script type="module" src="./discord-connect.js"></script>
</body>
</html>

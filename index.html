<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Index of my smart stuff</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #1a202c;
    color: #edf2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background-color: #2d3748;
    border-radius: 12px;
    padding: 30px 40px;
    box-shadow: 0 0 15px rgba(0,0,0,0.7);
    width: 350px;
    text-align: center;
  }
  h1 {
    margin-bottom: 25px;
    font-size: 24px;
  }
  .clock {
    margin-bottom: 20px;
  }
  .label {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
    color: #A1DAFF;
  }
  .time {
    font-size: 18px;
    line-height: 1.4;
  }
  .time .date {
    display: block;
    font-size: 12px;
    color: #9BB2C4;
  }
  .timezone-note {
    font-size: 11px;
    line-height: 1.35;
    margin-top: 8px;
  }
  select {
    width: auto;
    max-width: 100%;
    display: block;
    padding: 6px;
    border-radius: 6px;
    font-size: 12px;
    margin: 5px auto 10px;
    background-color: #1a202c;
    color: #d9edff;
    border: 1px solid rgba(0, 0, 0, 0.7);
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
    text-shadow: -1px 0 #1a202c, 1px 0 #1a202c, 0 -1px #1a202c, 0 1px #1a202c;
  }
  select option {
    background-color: #1a202c;
    color: #d9edff;
    text-shadow: -1px 0 #1a202c, 1px 0 #1a202c, 0 -1px #1a202c, 0 1px #1a202c;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Index of my smart stuff</h1>
  <ul style="text-align: left; padding-left: 24px; margin-bottom: 0;">
    <li><a href="liveworldtime.html" style="color: #A1DAFF;">World Time Together — Live World Clock</a></li>
  </ul>
</div>

</body>
</html>
